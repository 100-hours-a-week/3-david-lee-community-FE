<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>아무 말 대잔치 — 상세</title>
    <link rel="stylesheet" href="../css/post.css">
    <link rel="stylesheet" href="../css/comment.css">
    <link rel="stylesheet" href="../css/appbar.css">
</head>
<body>

<!-- 상단 앱바 -->
<header class="appbar" style="box-shadow:inset 0 -3px 0 #3b82f6">
    <div class="appbar__inner">
        <a class="appbar__back" href="/pages/html/post-list.html" aria-label="뒤로가기">← 뒤로</a>
        <strong class="appbar__title">아무 말 대잔치</strong>
        <div class="appbar__avatar" id="avatarBtn" title="프로필"></div>
        <nav class="menu" id="menu">
            <a href="/pages/html/account-edit.html">회원정보수정</a>
            <a href="/pages/html/account-password.html">비밀번호수정</a>
            <a href="/pages/html/login.html" id="logoutLink">로그아웃</a>
        </nav>
    </div>
</header>

<!-- 실제 컨테이너 -->
<main class="container">
    <div id="postRoot"><p>로딩 중...</p></div>
</main>

<!-- JS 로직 -->
<script type="module">
    import {getPostDetail, deletePost} from '../../api/post.js';
    import {saveComments} from "../../api/comment.js";
    import {createPostView} from '../../assets/postView.js';
    import {logout} from "../../api/auth.js";

    // ───────────── 드롭다운 ─────────────
    const menu = document.getElementById('menu');
    const avatarBtn = document.getElementById('avatarBtn');
    avatarBtn.addEventListener('click', () => {
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    });
    document.addEventListener('click', (e)=>{
        if(!menu.contains(e.target) && e.target !== avatarBtn) menu.style.display='none';
    });

    // ───────────── 로그아웃 ─────────────
    const logoutLink = document.getElementById('logoutLink');

    logoutLink?.addEventListener('click', async (e) => {
        e.preventDefault();           // 기본 페이지 이동 막기
        // 메뉴 닫기(선택)
        menu.style.display = 'none';

        // 버튼 중복 클릭 방지(선택)
        const originalText = logoutLink.textContent;
        logoutLink.textContent = '로그아웃 중...';
        logoutLink.style.pointerEvents = 'none';

        try {
            /// 로그아웃 호출
            await logout();

            /// 클라이언트 토큰/세션 정리 (상황에 맞게)
            localStorage.removeItem('accessToken');
            localStorage.removeItem('refreshToken');
            sessionStorage.clear();
            // 쿠키 토큰을 쓰는 경우 (도메인/경로 맞춰서)
            document.cookie = 'refreshToken=; Max-Age=0; path=/;';

            // 3) 이동
            location.href = '/pages/html/login.html';
        } catch (err) {
            // 서버 메시지가 있으면 우선 사용
            const msg = err?.response?.data?.message || err?.message || '로그아웃 중 오류가 발생했습니다.';
            alert(msg);
        } finally {
            // UX 복구
            logoutLink.textContent = originalText;
            logoutLink.style.pointerEvents = '';
        }
    });

    // ───────────── 기본 ─────────────
    const root = document.getElementById('postRoot');
    const params = new URLSearchParams(location.search);
    const postId = params.get('id');

    function showError(msg){
        root.innerHTML = `<p class="error" style="color:#c00">${msg}</p>`;
    }

    // ───────────── 목록 조회 ─────────────
    async function load() {
        try {
            if(!postId) throw new Error('잘못된 접근입니다. (id 누락)');
            const data = await getPostDetail(postId);

            // 백엔드 응답 → 뷰 모델 매핑
            const post = {
                id: data.id,
                title: data.title,
                content: data.content,
                author: data.author?.nickname,
                createdAt: data.createdAt,
                likeCount: data.likeCount ?? 0,
                viewCount: data.viewCount ?? 0,
                commentCount: data.commentCount ?? 0,
                images: data.image ?? [],
                comments: data.comments ?? [],
                editable: data.editable,
            };

            // 댓글 전달할 옵션 객체를 분리해서 생성
            const viewOptions = {
                onSubmitComment: async (p, text) => {
                    if (!text || !text.trim()) {
                        alert('댓글 내용을 입력해주세요.');
                        return;
                    }
                    try {
                        await saveComments(p.id, text);
                        await load();
                    } catch (e) {
                        alert('댓글 등록에 실패했습니다: ' + (e.message || ''));
                    }
                }
            };

            // [수정 3] post.editable이 true일 때만 수정/삭제 핸들러를 옵션에 추가
            if (post.editable) {
                viewOptions.onEdit = (p) => location.href = `/pages/html/post-edit.html?id=${encodeURIComponent(p.id)}`;
                viewOptions.onDelete = async (p) => {
                    if (!confirm('정말 삭제하시겠습니까?')) return;
                    try {
                        await deletePost(p.id);
                        alert('삭제되었습니다.');
                        location.href = '/pages/html/post-list.html';
                    } catch (e) {
                        alert('삭제 실패: ' + (e.message || ''));
                    }
                };
            }

            // 완성된 post 객체와 viewOptions를 전달
            const view = await createPostView(post, viewOptions);

            root.innerHTML = '';
            root.appendChild(view);
        } catch (e) {
            console.error(e);
            showError(e.message || '상세 조회 실패');
        }
    }

    load();
</script>
</body>
</html>
