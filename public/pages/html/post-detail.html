<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>아무 말 대잔치 — 상세</title>
    <link rel="stylesheet" href="../css/post.css">
    <link rel="stylesheet" href="../css/comment.css">
    <link rel="stylesheet" href="../css/appbar.css">
</head>
<body>

<!-- 상단 앱바 -->
<header class="appbar" style="box-shadow:inset 0 -3px 0 #3b82f6">
    <div class="appbar__inner">
        <a class="appbar__back" href="/pages/html/post-list.html" aria-label="뒤로가기">← 뒤로</a>
        <strong class="appbar__title">아무 말 대잔치</strong>
        <div class="appbar__avatar" id="avatarBtn" title="프로필"></div>
        <nav class="menu" id="menu">
            <a href="/pages/html/account-edit.html">회원정보수정</a>
            <a href="/pages/html/account-password.html">비밀번호수정</a>
            <a href="/pages/html/login.html" id="logoutLink">로그아웃</a>
        </nav>
    </div>
</header>

<!-- 실제 컨테이너 -->
<main class="container">
    <div id="postRoot"><p>로딩 중...</p></div>
</main>

<!-- JS 로직 -->
<script type="module">
    import {getPostDetail, deletePost} from '../../api/post.js';
    import {createPostView} from '../../assets/postView.js';
    import {initAppBar} from '../../assets/appbar.js';
    import {attachLogout} from '../../assets/logout.js';
    import {likePost} from "../../api/like.js";
    import {unlikePost} from "../../api/like.js";

    // ───────────── 기본 설정 ─────────────
    const { menu } = initAppBar();      // #avatarBtn / #menu 기본값 사용
    attachLogout('#logoutLink');        // 메뉴 안의 로그아웃 링크

    // ───────────── 내부 설정 ─────────────
    const root = document.getElementById('postRoot');
    const params = new URLSearchParams(location.search);

    /// ID 획득
    const postId = params.get('id');

    // ───────────── 예외 표기 설정 ─────────────
    function showError(msg){
        root.innerHTML = `<p class="error" style="color:#c00">${msg}</p>`;
    }

    // ───────────── 상세 조회 ─────────────
    async function load() {
        try {
            if(!postId) throw new Error('잘못된 접근입니다. (id 누락)');
            const data = await getPostDetail(postId);

            // 백엔드 응답 → 뷰 모델 매핑
            const post = {
                id: data.id,
                title: data.title,
                content: data.content,
                author: data.author?.nickname,
                createdAt: data.createdAt,
                likeCount: data.likeCount ?? 0,
                viewCount: data.viewCount ?? 0,
                commentCount: data.commentCount ?? 0,
                images: data.image ?? [],
                comments: data.comments ?? [],
                editable: data.editable,
                liked: data.liked,
            };

            // ───────────── 좋아요 ─────────────
            const viewOptions = {
                onLike: async (p) => {
                    const likeBtn = document.querySelector('[data-action="like"]');

                    // 이미 좋아요 눌렀는지 확인
                    const isLiked = likeBtn.classList.toggle('liked'); // 토글
                    try {
                        if (isLiked) {
                            await likePost({postId}); // 백엔드 호출
                            location.href = `/pages/html/post-detail.html?id=${encodeURIComponent(postId)}`;

                        } else {
                            await unlikePost(postId); // 백엔드 호출
                            location.href = `/pages/html/post-detail.html?id=${encodeURIComponent(postId)}`;
                        }

                    } catch (e) {
                        // 실패 시 원상 복귀
                        likeBtn.classList.toggle('liked', !isLiked);
                        likeBtn.style.color = isLiked ? '' : 'red';
                        alert('좋아요 처리 중 오류가 발생했습니다: ' + (e.message || ''));
                    }
                },
            };

            // ───────────── 수정/삭제 ─────────────
            if (post.editable) {
                // ───────────── 수정 ─────────────
                viewOptions.onEdit = () => location.href = `/pages/html/post-edit.html?id=${postId}`;

                // ───────────── 삭제 ─────────────
                viewOptions.onDelete = async () => {
                    if (!confirm('정말 삭제하시겠습니까?')) return;
                    try {
                        await deletePost(postId);
                        alert('삭제되었습니다.');
                        location.href = '/pages/html/post-list.html';
                    } catch (e) {
                        alert('삭제 실패: ' + (e.message || ''));
                    }
                };
            }

            // ───────────── post/viewOptions를 ─────────────
            const view = await createPostView(post, viewOptions);

            root.innerHTML = '';
            root.appendChild(view);

            // 조회 시 이미 좋아요였다면 버튼을 빨갛게
            if (post.liked) {
                const likeBtn = root.querySelector('[data-action="like"]');
                if (likeBtn) {
                    likeBtn.classList.add('liked');
                }
            }
        } catch (e) {
            console.error(e);
            showError(e.message || '상세 조회 실패');
        }
    }

    load();
</script>
</body>
</html>
