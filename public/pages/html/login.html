<!doctype html>
<html lang="ko">

<!-- 타이틀 -->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>개발자 커뮤니티 — 로그인</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/appbar.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/appfooter.css">
</head>
<body>

<!-- 상단 앱바 -->
<header class="appbar">
    <div class="appbar__inner">
        <div class="appbar__title">
            <span class="appbar__logo-icon">&lt;/&gt;</span>
            <span class="appbar__logo-text">개발자 커뮤니티</span>
        </div>
    </div>
</header>

<!-- 컨테이너 -->
<main class="container center">
    <section class="panel" aria-labelledby="login-title">
        <h1 id="login-title" class="title">로그인</h1>

        <form class="form" id="loginForm" autocomplete="on">
            <div class="field">
                <label class="label" for="email">이메일</label>
                <input class="input" id="email" name="email" type="email" placeholder="이메일을 입력하세요" required>
            </div>

            <div class="field">
                <label class="label" for="password">비밀번호</label>
                <input class="input" id="password" name="password" type="password" placeholder="비밀번호를 입력하세요" minlength="8" required>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn--primary">로그인</button>
            </div>
        </form>

        <!-- 별도의 회원가입 버튼 -->
        <div class="actions mt-12">
            <a href="/pages/html/signup.html" class="btn btn--ghost" aria-label="회원가입 페이지로 이동">
                회원가입
            </a>
        </div>
    </section>
</main>

<!-- 공통 풋터 -->
<footer class="appfooter"></footer>

<!-- JS 로직 -->
<script type="module" src="/pages/common/appfooter.js"></script>
<script type="module" src ="/js/login.js"></script>
</body>
</html>
