<!doctype html>
<html lang="ko">

<!-- 타이틀 -->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>아무 말 대잔치 — 게시글 수정</title>
    <link rel="stylesheet" href="../css/post-editor.css">
    <link rel="stylesheet" href="../css/appbar.css">
</head>

<!-- 상단 앱바 -->
<body>
<header class="appbar" style="box-shadow:inset 0 -3px 0 #3b82f6">
    <div class="appbar__inner">
        <a class="appbar__back" href="/pages/html/post-list.html" aria-label="뒤로가기">← 뒤로</a>
        <strong class="appbar__title">아무 말 대잔치</strong>
        <div class="appbar__avatar" id="avatarBtn" title="프로필"></div>
        <nav class="menu" id="menu">
            <a href="/pages/html/account-edit.html">회원정보수정</a>
            <a href="/pages/html/account-password.html">비밀번호수정</a>
            <a href="/pages/html/login.html">로그아웃</a>
        </nav>
    </div>
</header>

<!-- 컨테이너 -->
<main class="container">
    <h1 class="page">게시글 수정</h1>

    <section class="panel">
        <form id="editForm" class="form">
            <div class="field">
                <label class="label required" for="e-title">제목</label>
                <input class="input" id="e-title" name="title" type="text" maxlength="26" value="제목 1" required>
            </div>

            <div class="field">
                <label class="label required" for="e-content">내용</label>
                <textarea class="textarea" id="e-content" name="content" required>무엇을 얘기할까요? 아무말이지만, 실은 항상 놀라운 연결이라고 생각합니다. 우리는 매일 새로운 경험을 하고 배우며 성장합니다...</textarea>
                <div class="help">* helper text</div>
            </div>

            <div class="field">
                <label class="label" for="e-image">이미지</label>
                <div class="filebox">
                    <label for="e-image" class="fake">파일 선택</label>
                    <input id="e-image" name="image" type="file" accept="image/*">
                    <span id="e-filename" class="name">기존 파일 명</span>
                </div>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn--primary">수정하기</button>
            </div>
        </form>
    </section>
</main>

<!-- JS 로직 -->
<script type="module">

    // ───────────── 드롭다운 ─────────────
    const menu = document.getElementById('menu');
    const avatarBtn = document.getElementById('avatarBtn');
    avatarBtn.addEventListener('click', () => {
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    });
    document.addEventListener('click', (e)=>{
        if(!menu.contains(e.target) && e.target !== avatarBtn) menu.style.display='none';
    });

    const input = document.getElementById('e-image');
    const nameEl = document.getElementById('e-filename');
    input.addEventListener('change', () => {
        nameEl.textContent = input.files?.[0]?.name ?? '기존 파일 명';
    });

    document.getElementById('editForm').addEventListener('submit', (e)=>{
        e.preventDefault();
        const fd = new FormData(e.currentTarget);
        console.log('update ->', Object.fromEntries(fd.entries()));
    });
</script>
</body>
</html>
