<!doctype html>
<html lang="ko">

<!-- 타이틀 -->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>개발자 커뮤니티 — 게시글 수정</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/post-editor.css">
    <link rel="stylesheet" href="../css/appbar.css">
    <link rel="stylesheet" href="../css/appfooter.css">
</head>
<body>
<!-- 공통 헤더 -->
<header class="appbar"> </header>

<!-- 컨테이너 -->
<main class="container">
    <h1 class="page">게시글 수정</h1>

    <section class="panel">
        <form id="editForm" class="form">
            <!-- 제목 -->

            <div class="field">
                <label class="label required" for="e-title">제목</label>
                <input class="input" id="e-title" name="title" type="text" maxlength="26"
                       placeholder="수정할 제목을 입력해주세요. (최대 26글자)">
                <small id="titleCount" class="count">0 / 26</small>
            </div>

            <!-- 내용 -->
            <div class="field">
                <label class="label required" for="e-content">내용</label>
                <textarea class="textarea" id="e-content" name="content"
                          maxlength="1000" placeholder="수정할 내용을 입력해주세요." ></textarea>
                <small id="contentCount" class="count">0 / 1000</small>
            </div>

            <!-- 이미지 -->
            <div class="field">
                <label class="label" for="e-image">이미지 (드래그해서 순서변경)</label>
                <div class="filebox">
                    <label for="e-image" class="fake">파일 선택</label>
                    <input id="e-image" name="image" max="10" type="file" accept="image/*" multiple>
                </div>

                <!-- 이미지 썸네일 영역-->
                <div id="imageList" class="image-list"></div>
            </div>

            <!-- 수정 버튼 -->
            <div class="actions">
                <button type="submit" class="btn btn--primary">수정하기</button>
            </div>
        </form>
    </section>
</main>

<!-- 공통 풋터 -->
<footer class="appfooter"></footer>

<!-- JS 로직 -->
<script type="module" src="/pages/common/appbar.js"></script>
<script type="module" src="/pages/common/appfooter.js"></script>
<script type="module" src="/js/post-edit.js"></script>
</body>
</html>
