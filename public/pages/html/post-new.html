<!doctype html>
<html lang="ko">

<!-- 타이틀 -->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>아무 말 대잔치 — 게시글 작성</title>
    <link rel="stylesheet" href="../css/post-editor.css">
    <link rel="stylesheet" href="../css/appbar.css">
    <link rel="stylesheet" href="../css/appfooter.css">
</head>
<body>

<!-- 공통 헤더 -->
<header class="appbar"> </header>

<!-- 컨테이너-->
<main class="container">
    <h1 class="page">게시글 작성</h1>

    <section class="panel">
        <form id="postForm" class="form">
            <div class="field">
                <label class="label required" for="title">제목</label>
                <input class="input" id="title" name="title" type="text" maxlength="26"
                       placeholder="제목을 입력해주세요. (최대 26글자)" required>
            </div>

            <div class="field">
                <label class="label required" for="content">내용</label>
                <textarea class="textarea" id="content" name="content" placeholder="내용을 입력해주세요." required></textarea>
            </div>

            <div class="field">
                <label class="label" for="image">이미지</label>
                <div class="filebox">
                    <label for="image" class="fake">파일 선택</label>
                    <input id="image" name="image" type="file" accept="image/*">
                    <span id="filename" class="name">파일을 선택해주세요.</span>
                </div>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn--primary">완료</button>
            </div>
        </form>
    </section>
</main>

<!-- JS 스크립트 -->
<script type="module" src="/pages/common/appbar.js"></script>
<script type="module" src="/pages/common/appfooter.js"></script>
<script type="module" src="/js/post-new.js"></script>
</body>
</html>
