<!doctype html>
<html lang="ko">

<!-- 타이틀 -->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>아무 말 대잔치 — 게시글 작성</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/post-editor.css">
    <link rel="stylesheet" href="../css/appbar.css">
    <link rel="stylesheet" href="../css/appfooter.css">
</head>
<body>

<!-- 공통 헤더 -->
<header class="appbar"> </header>

<!-- 컨테이너-->
<main class="container">
    <h1 class="page">게시글 작성</h1>

    <section class="panel">
        <form id="postForm" class="form">
            <div class="field">
                <label class="label required" for="title">제목</label>
                <input class="input" id="title" name="title" type="text" maxlength="26"
                       placeholder="제목을 입력해주세요. (최대 26글자)">
                <small id="titleCount" class="count">0 / 26</small>
            </div>

            <div class="field">
                <label class="label required" for="content">내용</label>
                <textarea class="textarea" id="content" name="content" maxlength="1000" placeholder="내용을 입력해주세요.(최대 1000글자)"></textarea>
                <small id="contentCount" class="count">0 / 1000</small>
            </div>

            <div class="field">
                <label class="label" for="e-image">이미지 (드래그해서 순서변경)</label>
                <div class="filebox">
                    <label for="e-image" class="fake">파일 선택</label>
                    <input id="e-image" name="image" type="file" accept="image/*" multiple>
                </div>

                <!-- 이미지 썸네일 영역-->
                <div id="imageList" class="image-list"></div>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn--primary">완료</button>
            </div>
        </form>
    </section>
</main>

<!-- 공통 풋터 -->
<footer class="appfooter"></footer>

<!-- JS 로직 -->
<script type="module" src="/pages/common/appbar.js"></script>
<script type="module" src="/pages/common/appfooter.js"></script>
<script type="module" src="/js/post-new.js"></script>
</body>
</html>
