<!doctype html>
<html lang="ko">

<!-- 타이틀 -->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>아무 말 대잔치 — 게시글 작성</title>
    <link rel="stylesheet" href="../css/post-editor.css">
    <link rel="stylesheet" href="../css/appbar.css">
</head>
<body>

<!-- 상단 앱바 -->
<header class="appbar" style="box-shadow:inset 0 -3px 0 #3b82f6">
    <div class="appbar__inner">
        <a class="appbar__back" href="/pages/html/post-list.html" aria-label="뒤로가기">← 뒤로</a>
        <strong class="appbar__title">아무 말 대잔치</strong>
        <div class="appbar__avatar" id="avatarBtn" title="프로필"></div>
        <nav class="menu" id="menu">
            <a href="/pages/html/account-edit.html">회원정보수정</a>
            <a href="/pages/html/account-password.html">비밀번호수정</a>
            <a href="/pages/html/login.html" id="logoutLink">로그아웃</a>
        </nav>
    </div>
</header>

<!-- 컨테이너-->
<main class="container">
    <h1 class="page">게시글 작성</h1>

    <section class="panel">
        <form id="postForm" class="form">
            <div class="field">
                <label class="label required" for="title">제목</label>
                <input class="input" id="title" name="title" type="text" maxlength="26"
                       placeholder="제목을 입력해주세요. (최대 26글자)" required>
            </div>

            <div class="field">
                <label class="label required" for="content">내용</label>
                <textarea class="textarea" id="content" name="content" placeholder="내용을 입력해주세요." required></textarea>
            </div>

            <div class="field">
                <label class="label" for="image">이미지</label>
                <div class="filebox">
                    <label for="image" class="fake">파일 선택</label>
                    <input id="image" name="image" type="file" accept="image/*">
                    <span id="filename" class="name">파일을 선택해주세요.</span>
                </div>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn--primary">완료</button>
            </div>
        </form>
    </section>
</main>

<!-- JS 스크립트 -->
<script type="module">

    import {initAppBar} from '../../components/appbar.js';
    import {attachLogout} from '../../components/logout.js';
    import {createPost} from '../../api/post.js';

    // ───────────── 기본 설정 (아바타 및 로그아웃) ─────────────
    const { menu } = initAppBar();
    attachLogout('#logoutLink');

    // ───────────── 제출 로직 ─────────────
    document.getElementById('postForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const form = e.currentTarget;
        const categoryId = "2";
        const title = form.title.value.trim();
        const content = form.content.value.trim();
        const imageUrls = [];

        if (!title) return alert('제목을 입력하세요.');
        if (!content) return alert('내용을 입력하세요.');

        /// 값
        const payload = { categoryId, title, content, imageUrls };

        /// 호출
        try {
            const res = await createPost(payload);

            alert('글 작성이 완료되었습니다.');
            window.location.href = `/pages/html/post-detail.html?id=${encodeURIComponent(res.data.postId)}`;

        } catch (err) {
            console.error(err);
            alert(err?.message || '글 작성 중 오류가 발생했습니다.');
        }
    });
</script>
</body>
</html>
