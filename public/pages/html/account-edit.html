<!doctype html>
<html lang="ko">

<!-- 타이틀 -->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>개발자 커뮤니티 — 회원정보 수정</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/account.css">
    <link rel="stylesheet" href="../css/appbar.css">
    <link rel="stylesheet" href="../css/appfooter.css">

</head>
<body>

<!-- 공통 헤더 -->
<header class="appbar"> </header>

<!-- 실제 컨테이너 -->
<main class="container">
    <h1 class="page">회원정보 수정</h1>

    <section class="panel">
        <!-- 프로필 사진 -->
        <div class="label" style="text-align:left; margin-bottom:6px">프로필 사진*</div>
        <div class="profile">
            <span id="profileAvatar" aria-hidden="true"></span> <button type="button" id="changeImageBtn">변경</button>
        </div>

        <!-- 폼 -->
        <form class="form" id="accountForm">
            <div class="field">
                <label class="label" for="email">이메일</label>
                <input class="input" id="email" type="email" disabled>
            </div>

            <div class="field">
                <label class="label" for="nickname">닉네임</label>
                <input class="input" id="nickname" type="text" placeholder="닉네임을 입력하세요" required>
            </div>

            <!-- 수정 / 탈퇴 버튼 -->
            <div class="actions">
                <button type="submit" class="btn btn--primary">수정하기</button>
            </div>
            <div class="actions">
                <button type="button" class="btn btn--danger" id="withdrawBtn">회원 탈퇴</button>
            </div>
        </form>
    </section>
</main>

<!-- 공통 풋터 -->
<footer class="appfooter"></footer>

<!-- JS 로직 -->
<script type="module" src="/pages/common/appbar.js"></script>
<script type="module" src="/pages/common/appfooter.js"></script>
<script type="module" src="/js/account-edit.js"></script>

</body>
</html>
