<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>아무 말 대잔치 — 회원가입</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>
<header class="appbar">
    <div class="appbar__inner">
        <a class="appbar__back" href="/pages/html/login.html" aria-label="뒤로 가기">←</a>
        <strong class="appbar__title">아무 말 대잔치</strong>
    </div>
</header>

<main class="container center">
    <section class="panel" aria-labelledby="signup-title">
        <h1 id="signup-title" class="title">회원가입</h1>

        <div class="avatar-uploader" aria-label="프로필 사진">
            <div style="font-weight:700">프로필 사진</div>
            <div class="note">* helper text</div>
            <div class="avatar-circle">+</div>
        </div>

        <form class="form" id="signupForm" style="margin-top:14px">
            <div class="field">
                <label class="label" for="s-email">이메일*</label>
                <input class="input" id="s-email" name="email" type="email" placeholder="이메일을 입력하세요" required>
                <div class="help">* helper text</div>
            </div>

            <div class="field">
                <label class="label" for="s-pw">비밀번호*</label>
                <input class="input" id="s-pw" name="password" type="password" placeholder="비밀번호를 입력하세요" minlength="6" required>
                <div class="help">* helper text</div>
            </div>

            <div class="field">
                <label class="label" for="s-pw2">비밀번호 확인*</label>
                <input class="input" id="s-pw2" name="password2" type="password" placeholder="비밀번호를 한 번 더 입력하세요" minlength="6" required>
                <div class="help">* helper text</div>
            </div>

            <div class="field">
                <label class="label" for="s-nick">닉네임*</label>
                <input class="input" id="s-nick" name="nickname" type="text" placeholder="닉네임을 입력하세요" required>
                <div class="help">* helper text</div>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn--primary">회원가입</button>
            </div>

            <div class="linkrow">
                <a href="/pages/html/login.html">로그인하러 가기</a>
            </div>
        </form>
    </section>
</main>

<script type="module">
    document.getElementById('signupForm')?.addEventListener('submit', (e)=>{
        e.preventDefault();
        const f = e.currentTarget;

        if(f.password.value !== f.password2.value){
            alert('비밀번호가 일치하지 않습니다.');
            return;
        }

        console.log('signup ->', f.email.value, f.password.value, f.nickname.value);
    });
</script>
</body>
</html>
