<!doctype html>
<html lang="ko">

<!-- 타이틀 -->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>아무 말 대잔치 — 회원가입</title>
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/appfooter.css">
</head>
<body>

<!-- 상단 앱바 -->
<header class="appbar">
    <div class="appbar__inner">
        <a class="appbar__back" href="/pages/html/login.html" aria-label="뒤로 가기">←</a>
        <strong class="appbar__title">아무 말 대잔치</strong>
    </div>
</header>

<!-- 컨테이너-->
<main class="container center">
    <!-- 인사/헤더 -->
    <section class="panel" aria-labelledby="signup-title">
        <h1 id="signup-title" class="title">회원가입</h1>

        <!-- S3 프런트 이미지 추가 -->
        <div class="avatar-uploader" id="avatar-uploader" aria-label="프로필 사진">
            <div style="font-weight:700">프로필 사진</div>
            <div class="avatar-circle" id="avatarCircle" role="button" tabindex="0">+</div>
            <!-- 미리보기 이미지 -->
            <img id="avatarPreview" alt="미리보기" style="display:none"/>
        </div>

        <!-- 개인정보 추가 -->
        <form class="form" id="signupForm" style="margin-top:14px">

            <div class="field">
                <label class="label" for="s-name">이름*</label>
                <input class="input" id="s-name" name="name" type="text" placeholder="이름을 입력하세요" required>
            </div>

            <div class="field">
                <label class="label" for="s-email">이메일*</label>
                <input class="input" id="s-email" name="email" type="email" placeholder="이메일을 입력하세요" required>
            </div>

            <div class="field">
                <label class="label" for="s-pw">비밀번호*</label>
                <input class="input" id="s-pw" name="password" type="password" placeholder="비밀번호를 입력하세요" minlength="8" maxlength="20" required>
            </div>

            <div class="field">
                <label class="label" for="s-pw2">비밀번호 확인*</label>
                <input class="input" id="s-pw2" name="password2" type="password" placeholder="비밀번호를 한 번 더 입력하세요" minlength="8" maxlength="20" required>
            </div>

            <div class="field">
                <label class="label" for="s-nick">닉네임*</label>
                <input class="input" id="s-nick" name="nickname" type="text" placeholder="닉네임을 입력하세요" maxlength="10" required>
            </div>

            <!-- 업로드 후 서버에 보낼 키를 담을 hidden -->
            <input type="hidden" name="avatarKey" id="avatarKey"/>

            <div class="actions">
                <button type="submit" class="btn btn--primary">회원가입</button>
            </div>

            <div class="linkrow">
                <a href="/pages/html/login.html">로그인하러 가기</a>
            </div>
        </form>
    </section>
</main>

<!-- JS 로직 -->
<script type="module" src="/js/image-temp.js"></script>
<script type="module" src="/pages/common/appfooter.js"></script>
<script type="module" src="/js/signup.js"></script>

</body>
</html>
