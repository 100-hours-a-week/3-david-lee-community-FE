<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>아무 말 대잔치 — 목록</title>
    <link rel="stylesheet" href="../css/board.css">
</head>
<body>
<!-- 상단 앱바 -->
<header class="appbar">
    <div class="appbar__inner">
        <strong class="appbar__title">아무 말 대잔치</strong>
        <div class="appbar__avatar" title="내 프로필"></div>
    </div>
</header>

<main class="container">
    <!-- 인사/헤더 -->
    <section class="hero">
        <h1>안녕하세요,<br>아무 말 대잔치 <b>게시판</b> 입니다.</h1>
        <p>가볍게 한 마디 적어보세요.</p>
        <div style="margin-top:12px">
            <a class="btn btn--primary" href="/pages/html/board-new.html">게시글 작성</a>
        </div>
    </section>

    <!-- 리스트 -->
    <section class="list">
        <!-- 카드 예시 1 -->
        <article class="card card--hover">
            <div class="post__header">
                <div>
                    <h3 class="post__title">제목 1</h3>
                    <div class="post__meta">
                        <span>좋아요 0</span><span class="dot"></span>
                        <span>댓글 0</span><span class="dot"></span>
                        <span>조회수 0</span><span class="dot"></span>
                        <time datetime="2021-01-01T00:00:00">2021-01-01 00:00:00</time>
                    </div>
                </div>
            </div>
            <div class="author">
                <div class="author__avatar"></div>
                <div class="author__name">더미 작성자 1</div>
            </div>
        </article>

        <!-- 동일 스타일의 더미 카드들 -->
        <article class="card card--hover">
            <div class="post__header">
                <div>
                    <h3 class="post__title">제목 1</h3>
                    <div class="post__meta">
                        <span>좋아요 0</span><span class="dot"></span>
                        <span>댓글 0</span><span class="dot"></span>
                        <span>조회수 0</span><span class="dot"></span>
                        <time datetime="2021-01-01T00:00:00">2021-01-01 00:00:00</time>
                    </div>
                </div>
            </div>
            <div class="author">
                <div class="author__avatar"></div>
                <div class="author__name">더미 작성자 1</div>
            </div>
        </article>

        <article class="card card--hover">
            <div class="post__header">
                <div>
                    <h3 class="post__title">제목 1</h3>
                    <div class="post__meta">
                        <span>좋아요 0</span><span class="dot"></span>
                        <span>댓글 0</span><span class="dot"></span>
                        <span>조회수 0</span><span class="dot"></span>
                        <time datetime="2021-01-01T00:00:00">2021-01-01 00:00:00</time>
                    </div>
                </div>
            </div>
            <div class="author">
                <div class="author__avatar"></div>
                <div class="author__name">더미 작성자 1</div>
            </div>
        </article>
    </section>
</main>
</body>
</html>
