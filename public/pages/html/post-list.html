<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>아무 말 대잔치 — 목록</title>
    <link rel="stylesheet" href="../css/post.css">
</head>
<body>
<!-- 상단 앱바 -->
<header class="appbar">
    <div class="appbar__inner">
        <strong class="appbar__title">아무 말 대잔치</strong>
        <div class="appbar__avatar" title="내 프로필"></div>
    </div>
</header>

<main class="container">
    <!-- 인사/헤더 -->
    <section class="hero">
        <h1>안녕하세요,<br>아무 말 대잔치 <b>게시판</b> 입니다.</h1>
        <p>가볍게 한 마디 적어보세요.</p>
        <div style="margin-top:12px">
            <a class="btn btn--primary" href="/pages/html/post-new.html">게시글 작성</a>
        </div>
    </section>

    <!-- 리스트 -->
    <section class="list" id="postList"></section>

</main>
<!-- JS 로직 -->
<script type="module">
    import { getPosts } from '../../api/post.js';
    import { createPostCard } from '../../assets/postCard.js';

    const listEl = document.getElementById('postList');

    function showError(msg) {
        listEl.innerHTML = `<p class="error" style="color:#c00">${msg}</p>`;
    }

    async function renderList() {
        try {
            // API 응답 전체를 response 변수에 저장합니다.
            const response = await getPosts(2);

            // 실제 게시글 목록은 response.data.content 에 있습니다.
            const postList = response.data.content;

            // 백엔드 응답 구조 맞춰서 데이터 가공
            const posts = postList.map(p => ({
                id: p.id,
                title: p.title,
                likes: p.likeCount,
                comments: p.commentCount,
                views: p.viewCount,
                date: p.createdAt,
                author: p.user?.nickname,
            }));

            listEl.innerHTML = '';

            if (posts.length === 0) {
                listEl.innerHTML = `<p class="empty">게시글이 없습니다.</p>`;
                return;
            }

            for (const post of posts) {
                const card = await createPostCard(post, {
                    onClick: (p) => {
                        location.href = `/pages/html/post-detail.html?id=${encodeURIComponent(p.id)}`;
                    },
                });
                listEl.appendChild(card);
            }
        } catch (err) {
            console.error(err);
            // API 응답 자체에 에러 메시지가 있을 경우 그것을 사용합니다.
            const errorMessage = err.response?.data?.message || err.message;
            showError(errorMessage);
        }
    }

    // 초기화 실행
    renderList();
</script>

</body>
</html>
