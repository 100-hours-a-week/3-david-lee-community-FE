<!doctype html>
<html lang="ko">

<!-- 타이틀 -->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>아무 말 대잔치 — 비밀번호 수정</title>
    <link rel="stylesheet" href="../css/account.css">
    <link rel="stylesheet" href="../css/appbar.css">
</head>
<body>

<!-- 상단 앱바 -->
<header class="appbar" style="box-shadow:inset 0 -3px 0 #3b82f6">
    <div class="appbar__inner">
        <a class="appbar__back" href="/pages/html/post-list.html" aria-label="뒤로가기">← 뒤로</a>
        <strong class="appbar__title">아무 말 대잔치</strong>
        <div class="appbar__avatar" id="avatarBtn" title="프로필"></div>
        <nav class="menu" id="menu">
            <a href="/pages/html/account-edit.html">회원정보수정</a>
            <a href="/pages/html/account-password.html">비밀번호수정</a>
            <a href="/pages/html/login.html" id="logoutLink">로그아웃</a>
        </nav>
    </div>
</header>

<!-- 실제 컨테이너 -->
<main class="container">
    <h1 class="page">비밀번호 수정</h1>

    <section class="panel" style="text-align:left">
        <form class="form" id="pwForm">
            <div class="field">
                <label class="label" for="pw">기존 비밀번호</label>
                <input class="input" id="pw" type="password" placeholder="기존 비밀번호를 입력하세요" minlength="8" maxlength="20" required>
                <small class="field__error" aria-live="polite"></small>
            </div>
            <div class="field">
                <label class="label" for="pw1">새로운 비밀번호</label>
                <input class="input" id="pw1" type="password" placeholder="새로운 비밀번호를 입력하세요" minlength="8" maxlength="20" required>
                <small class="field__error" aria-live="polite"></small>
            </div>

            <div class="field">
                <label class="label" for="pw2">새로운 비밀번호 확인</label>
                <input class="input" id="pw2" type="password" placeholder="새로운 비밀번호를 한 번 더 입력하세요" minlength="8" maxlength="20" required>
                <small class="field__error" aria-live="polite"></small>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn--primary">수정하기</button>
            </div>
        </form>
    </section>
</main>

<script type="module">

</script>
</body>
</html>
