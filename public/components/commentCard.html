<template id="commentCard">
  <article class="card card--hover">

    <!-- 헤더 -->
    <div class="comment__header">
      <div>
        <div class="comment__body">
        <div class="comment__content"></div>
        </div>
      </div>
    </div>

    <!-- 작성자 -->
    <div class="author">
      <div class="author__avatar"></div>
      <span class="author__url"></span>
      <div class="author__name"></div>
    </div>
    <time></time>

    <!-- 수정/삭제-->
    <div class="toolbar">
      <button class="btn btn--ghost btn--small" data-action="edit">수정</button>
      <button class="btn btn--ghost btn--small" data-action="delete">삭제</button>
    </div>


  </article>
</template>
