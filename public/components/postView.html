<template id="postView">
  <section class="card postview">

    <!-- 헤더 -->
    <div class="post__header">
      <div>
        <h1 class="title"></h1>

        <!-- 유저 -->
        <div class="sub">
          <div class="sub">
            <div style="display:flex; align-items:center; gap:8px">
              <div class="author__avatar">
                <img alt="작성자" />
              </div>
              <span class="author__name"></span>
              <div class="createdAt"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 수정/삭제/좋아요 -->
      <div class="toolbar">
        <button class="btn btn--ghost btn--small" data-action="edit">수정</button>
        <button class="btn btn--ghost btn--small" data-action="delete">삭제</button>
      </div>
    </div>

    <hr class="divider">


    <!-- 미디어 -->
    <div class="media">
      <section class="post__gallery" data-gallery>
        <div class="gallery__main" tabindex="0">
          <img alt="" />
          <button class="gallery__nav gallery__nav--prev" type="button" aria-label="이전 이미지">‹</button>
          <button class="gallery__nav gallery__nav--next" type="button" aria-label="다음 이미지">›</button>
        </div>
        <div class="gallery__thumbs" role="list"></div>
      </section>
    </div>


    <!-- 본문 -->
    <article class="content"></article>

    <!-- 통계 -->
    <div class="stats">
      <!-- 통계 첫 칸을 버튼으로 변경 -->
      <button class="stat--like" type="button"
              data-action="toggle-like" aria-pressed="false">
        <div class="top">
          <span class="heart"></span>
          <span class="likeCount">0</span>
        </div>
        <div class="label">좋아요 수</div>
      </button>


      <div class="stat">
        <div class="num viewCount">0</div>
        <div class="label">조회수</div>
      </div>
      <div class="stat">
        <div class="num commentCount">0</div>
        <div class="label">댓글수</div>
      </div>
    </div>

    <hr class="divider">

    <!-- 댓글 입력 -->
    <div class="commentbox">
      <textarea id="comment" placeholder="댓글을 남겨주세요!"></textarea>
      <button class="btn btn--primary btn--inside" data-action="comment">댓글 등록</button>
    </div>

    <!-- 댓글 리스트 -->
    <section class="comments">
      <div id="commentList" class="comment-list"></div>
    </section>

  </section>
</template>
