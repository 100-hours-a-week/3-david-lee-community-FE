<template id="postCard">
    <article class="card card--hover">
        <div class="post__header">
            <div>
                <h3 class="post__title"></h3>
                <div class="post__meta">
                    <span class="likes"></span><span class="dot"></span>
                    <span class="comments"></span><span class="dot"></span>
                    <span class="views"></span><span class="dot"></span>
                    <time></time>
                </div>
            </div>
        </div>
        <div class="author">
            <div class="author__avatar"></div>
            <div class="author__name"></div>
        </div>
    </article>
</template>
